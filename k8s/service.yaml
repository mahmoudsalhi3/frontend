apiVersion: v1
kind: Service
metadata:
  name: minolingo-frontend
  labels:
    app: minolingo-frontend
spec:
  type: NodePort
  selector:
    app: minolingo-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30081
    - name: metrics
      port: 9113
      targetPort: 9113
      nodePort: 30113
